<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="${description} ?: 'William Solari - full-stack developer working on Peppol e-invoicing infrastructure, self-hosted platforms, and developer tools.'">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${title} ?: 'William Solari - Full-Stack Developer'">William Solari</title>

    <link rel="canonical" th:href="${canonicalUrl} ?: 'https://williamsolari.com/'">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="William Solari">
    <meta property="og:url" th:content="${canonicalUrl} ?: 'https://williamsolari.com/'">
    <meta property="og:title" th:content="${title} ?: 'William Solari - Full-Stack Developer'">
    <meta property="og:description" th:content="${description} ?: 'William Solari - full-stack developer working on Peppol e-invoicing infrastructure, self-hosted platforms, and developer tools.'">
    <meta property="og:image" th:content="${ogImage} ?: 'https://williamsolari.com/images/og-image.png'">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" th:content="${title} ?: 'William Solari - Full-Stack Developer'">
    <meta name="twitter:description" th:content="${description} ?: 'William Solari - full-stack developer working on Peppol e-invoicing infrastructure, self-hosted platforms, and developer tools.'">
    <meta name="twitter:image" th:content="${ogImage} ?: 'https://williamsolari.com/images/og-image.png'">

    <link rel="stylesheet" th:href="@{/css/fonts.css}">
    <link rel="stylesheet" th:href="@{/css/icons.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"/>

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">

    <th:block layout:fragment="styles"></th:block>
</head>
<body>
<nav class="navbar" th:replace="~{portfolio/fragments/navbar :: navbar}"></nav>

<main>
    <div layout:fragment="content"></div>
    <footer class="footer" th:replace="~{portfolio/fragments/footer :: footer}"></footer>
</main>

<script th:src="@{/js/main.js}" defer></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
