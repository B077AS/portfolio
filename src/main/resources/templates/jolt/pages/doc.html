<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{jolt/layouts/layout}">
<body>
<th:block layout:fragment="content">
    <div class="wrap docs">
        <aside class="side" aria-label="Documentation">
            <th:block th:each="g : ${docGroups}">
                <h4 th:text="${g.key}">Group</h4>
                <a th:each="p : ${g.value}" th:href="@{${p.path()}}" th:text="${p.title()}"
                   th:classappend="${p.slug() == doc.slug()} ? 'on'"
                   th:attr="aria-current=${p.slug() == doc.slug()} ? 'page' : null">Page</a>
            </th:block>
        </aside>

        <article class="doc">
            <div class="kicker" th:text="${doc.group()}">Group</div>
            <h1 th:text="${doc.title()}">Title</h1>
            <p class="lead" th:text="${doc.description()}">Description</p>

            <th:block th:replace="~{${'jolt/docs/' + doc.slug()} :: body}"></th:block>

            <div class="pn">
                <a th:if="${prev != null}" th:href="@{${prev.path()}}" rel="prev">
                    <small><i class="mdi mdi-arrow-left" aria-hidden="true"></i> Previous</small><b th:text="${prev.title()}">Previous page</b>
                </a>
                <a th:if="${next != null}" th:href="@{${next.path()}}" rel="next" class="next">
                    <small>Next <i class="mdi mdi-arrow-right" aria-hidden="true"></i></small><b th:text="${next.title()}">Next page</b>
                </a>
            </div>
        </article>

        <aside class="toc" aria-label="On this page">
            <h4>On this page</h4>
            <div class="toclinks"></div>
        </aside>
    </div>
</th:block>
</body>
</html>
