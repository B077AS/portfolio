spring.application.name=portfolio

spring.thymeleaf.cache=false

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.config.import=optional:classpath:application-local.properties

site.portfolio-url=https://williamsolari.com

site.jolt.hosts=jolt.williamsolari.com,jolt.localhost
site.jolt.base-url=https://jolt.williamsolari.com
site.jolt.version-url=https://api.github.com/repos/B077AS/jolt/releases/latest
site.jolt.github-url=https://github.com/B077AS/jolt
site.jolt.parsel-github-url=https://github.com/B077AS/parsel
site.jolt.parsel-releases-url=https://github.com/B077AS/parsel/releases/latest
site.jolt.maven-central-url=https://central.sonatype.com/artifact/io.github.b077as/jolt-core
site.jolt.changelog-url=https://raw.githubusercontent.com/B077AS/jolt/master/CHANGELOG.md

server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,application/xml,text/plain,image/svg+xml
